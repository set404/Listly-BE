name: Keep backend awake

# GitHub Actions' `schedule` trigger is best-effort and, in practice on
# this repo, silently dropped most 14-min ticks entirely (not delayed -
# just never ran, no error, nothing in the run history). GitHub gives no
# SLA for schedule triggers and drops them under load with no retry, so
# the actual keep-alive pinging now lives on an external cron service
# (cron-job.org) hitting /api/health directly every ~14 min, 12:00-21:00
# Armenia time. This workflow is kept only for manual/on-demand pings.
on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Render free-tier cold starts can take 30-50+ s. A too-short
      # --max-time aborts the request before the instance finishes
      # booting, which can leave it half-woken and makes the *next*
      # scheduled ping fail too, cascading into a run of failures.
      - name: Ping health endpoint
        run: curl -fsS --max-time 100 https://listly-be.onrender.com/api/health
